name: kani-lane
on:
  push:
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'vendor/**']
  pull_request:
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'vendor/**']

jobs:
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kani
        uses: model-checking/kani-github-action@v1
      - name: cargo kani (the core's arithmetic laws)
        run: cargo kani --quiet
