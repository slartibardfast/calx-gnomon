name: kani-lane
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'vendor/**']
  pull_request:
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'vendor/**']

jobs:
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kani (from $HOME so the repo's vendored source replacement does not capture the installer)
        run: |
          cd "$HOME"
          cargo install --locked kani-verifier
      - name: cargo kani (the core's arithmetic laws)
        run: cargo kani --quiet
